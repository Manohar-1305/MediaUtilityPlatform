<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Combiner</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 18px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#101a38,#334b91,#7655a8);color:#202b45}
.container{max-width:850px;margin:24px auto;background:#fff;padding:32px;border-radius:20px;box-shadow:0 22px 65px #080d2760}
.header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:25px}
.eyebrow{font-size:12px;font-weight:bold;letter-spacing:2px;color:#6755d9}
h1{margin:8px 0;font-size:30px;color:#19264a}
.description{color:#68738a;line-height:1.6;margin:0}
.dashboard{display:inline-block;padding:12px 16px;border-radius:9px;background:#edf0ff;color:#4437b7;text-decoration:none;font-weight:bold;font-size:14px}
.dashboard:hover{background:#dfe4ff}
.dropzone{margin-top:25px;padding:32px 16px;text-align:center;background:#f5f6ff;border:2px dashed #8999dc;border-radius:15px}
.upload{display:inline-block;margin-top:17px;padding:13px 24px;border-radius:9px;background:linear-gradient(135deg,#315bea,#7848d7);color:#fff;font-weight:bold;cursor:pointer}
.upload:hover{filter:brightness(1.08)}
input[type=file]{display:none}
.hint{font-size:13px;color:#707b91;margin-bottom:0}
.file-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:25px}
h3{margin:0;color:#253252}
#fileList{list-style:none;padding:0;margin:14px 0}
#fileList li{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:9px;border:1px solid #e2e7f1;border-radius:10px;background:#fff}
.file-icon{flex-shrink:0;background:#fff0f0;color:#c43c4a;padding:9px;border-radius:8px;font-weight:bold;font-size:12px}
.file-info{min-width:0;flex:1}
.file-name{font-weight:bold;overflow-wrap:anywhere;color:#283653}
.file-size{font-size:12px;color:#7a8498;margin-top:5px}
.actions{display:flex;gap:5px;flex-shrink:0}
button{padding:9px 12px;border:0;border-radius:7px;cursor:pointer;font-weight:bold}
button:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#edf0f7;color:#34415e}
.remove{background:#fff0f0;color:#b42332}
.primary{width:100%;margin-top:12px;padding:15px;background:linear-gradient(135deg,#315bea,#7848d7);color:white;font-size:15px}
#status{margin-top:18px;line-height:1.5;overflow-wrap:anywhere;color:#43516c}
@media(max-width:600px){.container{padding:20px;margin:5px auto}.header{align-items:flex-start}h1{font-size:25px}#fileList li{flex-wrap:wrap}.actions{margin-left:auto}}
</style>
</head>
<body>
<main class="container">
<header class="header">
<div>
<span class="eyebrow">PDF TOOLS</span>
<h1>PDF Combiner</h1>
<p class="description">Combine multiple PDF documents into one file in your preferred order.</p>
</div>
<a class="dashboard" href="/">⌂ Return to Dashboard</a>
</header>

<div class="dropzone">
<strong>Select multiple PDF documents</strong><br>
<label class="upload" for="fileInput">＋ Upload PDFs</label>
<input id="fileInput" type="file" accept=".pdf,application/pdf" multiple>
<p class="hint">Select 2–30 PDFs · Maximum combined size: 100 MB</p>
</div>

<div class="file-heading">
<h3 id="fileCount">Selected files (0)</h3>
<button type="button" id="clearButton" class="secondary">Clear all</button>
</div>
<ul id="fileList"></ul>
<button type="button" id="mergeButton" class="primary" disabled>Combine PDFs</button>
<div id="status" role="status" aria-live="polite"></div>
</main>

<script>
const input=document.getElementById("fileInput");
const fileList=document.getElementById("fileList");
const fileCount=document.getElementById("fileCount");
const mergeButton=document.getElementById("mergeButton");
const clearButton=document.getElementById("clearButton");
const status=document.getElementById("status");
let selectedFiles=[];

function sizeText(bytes){
 return bytes<1048576?(bytes/1024).toFixed(1)+" KB":(bytes/1048576).toFixed(2)+" MB";
}
function renderFiles(){
 fileList.replaceChildren();
 fileCount.textContent=`Selected files (${selectedFiles.length})`;
 mergeButton.disabled=selectedFiles.length<2;
 selectedFiles.forEach((file,index)=>{
  const li=document.createElement("li");
  const icon=document.createElement("span");
  icon.className="file-icon";icon.textContent="PDF";
  const info=document.createElement("div");info.className="file-info";
  const name=document.createElement("div");name.className="file-name";
  name.textContent=`${index+1}. ${file.name}`;
  const size=document.createElement("div");size.className="file-size";
  size.textContent=sizeText(file.size);
  info.append(name,size);
  const actions=document.createElement("div");actions.className="actions";
  [["↑",-1],["↓",1]].forEach(([label,offset])=>{
   const b=document.createElement("button");b.type="button";b.className="secondary";
   b.textContent=label;b.disabled=index+offset<0||index+offset>=selectedFiles.length;
   b.setAttribute("aria-label",label==="↑"?"Move up":"Move down");
   b.onclick=()=>{const target=index+offset;[selectedFiles[index],selectedFiles[target]]=[selectedFiles[target],selectedFiles[index]];renderFiles();};
   actions.appendChild(b);
  });
  const remove=document.createElement("button");remove.type="button";
  remove.className="remove";remove.textContent="Remove";
  remove.onclick=()=>{selectedFiles.splice(index,1);renderFiles();};
  actions.appendChild(remove);li.append(icon,info,actions);fileList.appendChild(li);
 });
}
input.addEventListener("change",()=>{
 const incoming=Array.from(input.files);
 const invalid=incoming.find(f=>!f.name.toLowerCase().endsWith(".pdf"));
 if(invalid){status.textContent=`${invalid.name} is not a PDF file.`;input.value="";return;}
 for(const file of incoming){
  if(!selectedFiles.some(f=>f.name===file.name&&f.size===file.size&&f.lastModified===file.lastModified))selectedFiles.push(file);
 }
 if(selectedFiles.length>30){selectedFiles=selectedFiles.slice(0,30);status.textContent="Maximum 30 PDF files allowed.";}
 else status.textContent="";
 input.value="";renderFiles();
});
clearButton.addEventListener("click",()=>{selectedFiles=[];status.textContent="";renderFiles();});
mergeButton.addEventListener("click",async()=>{
 if(selectedFiles.length<2)return;
 if(selectedFiles.reduce((sum,f)=>sum+f.size,0)>100*1024*1024){status.textContent="Combined upload exceeds the 100 MB limit.";return;}
 const formData=new FormData();selectedFiles.forEach(f=>formData.append("files",f));
 mergeButton.disabled=true;status.textContent="Combining PDFs. Please wait...";
 try{
  const response=await fetch("/merge/",{method:"POST",body:formData});
  if(!response.ok){let message="PDF combination failed.";try{const result=await response.json();message=result.error||message;}catch(_){}throw new Error(message);}
  const blob=await response.blob();const url=URL.createObjectURL(blob);
  const link=document.createElement("a");link.href=url;link.download="combined.pdf";
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  status.textContent="PDFs combined successfully. Download started.";
 }catch(error){status.textContent=error.message||"Unable to reach the PDF Combiner.";}
 finally{mergeButton.disabled=selectedFiles.length<2;}
});
renderFiles();
</script>
</body>
</html>
