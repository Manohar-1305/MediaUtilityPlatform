apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-to-word
  namespace: media-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-to-word
  template:
    metadata:
      labels:
        app: pdf-to-word
    spec:
      containers:
        - name: pdf-to-word
          image: manoharshetty507/pdf-to-word:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5012
          envFrom:
            - configMapRef:
                name: media-tools-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-tools-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5012
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5012
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-to-word
  namespace: media-tools
spec:
  selector:
    app: pdf-to-word
  ports:
    - name: http
      port: 5012
      targetPort: http
