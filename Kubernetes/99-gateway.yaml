apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-tools-gateway
  namespace: media-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-tools-gateway
  template:
    metadata:
      labels:
        app: media-tools-gateway
    spec:
      containers:
        - name: gateway
          image: manoharshetty507/media-tools-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: media-tools-config
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: media-tools-gateway
  namespace: media-tools
spec:
  type: NodePort
  selector:
    app: media-tools-gateway
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30000
      targetPort: http
      nodePort: 30000
