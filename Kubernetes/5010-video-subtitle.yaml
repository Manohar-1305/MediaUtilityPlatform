apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-subtitle
  namespace: media-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-subtitle
  template:
    metadata:
      labels:
        app: video-subtitle
    spec:
      containers:
        - name: video-subtitle
          image: manoharshetty507/video-subtitle:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5010
          envFrom:
            - configMapRef:
                name: media-tools-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-tools-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5010
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5010
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: video-subtitle
  namespace: media-tools
spec:
  selector:
    app: video-subtitle
  ports:
    - name: http
      port: 5010
      targetPort: http
