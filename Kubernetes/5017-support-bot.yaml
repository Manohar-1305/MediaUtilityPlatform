apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-bot
  namespace: media-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support-bot
  template:
    metadata:
      labels:
        app: support-bot
    spec:
      containers:
        - name: support-bot
          image: manoharshetty507/support-bot:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5017
          envFrom:
            - configMapRef:
                name: media-tools-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-tools-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5017
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5017
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: support-bot
  namespace: media-tools
spec:
  selector:
    app: support-bot
  ports:
    - name: http
      port: 5017
      targetPort: http
