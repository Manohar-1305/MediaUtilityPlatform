apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: media-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: manoharshetty507/user:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5006
          envFrom:
            - configMapRef:
                name: media-tools-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-tools-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: media-tools
spec:
  selector:
    app: user
  ports:
    - name: http
      port: 5006
      targetPort: http
