apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-converter
  namespace: media-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-converter
  template:
    metadata:
      labels:
        app: pdf-converter
    spec:
      containers:
        - name: pdf-converter
          image: manoharshetty507/pdf-converter:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5004
          envFrom:
            - configMapRef:
                name: media-tools-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-tools-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5004
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5004
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-converter
  namespace: media-tools
spec:
  selector:
    app: pdf-converter
  ports:
    - name: http
      port: 5004
      targetPort: http
