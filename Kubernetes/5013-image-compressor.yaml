apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-compressor
  namespace: media-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-compressor
  template:
    metadata:
      labels:
        app: image-compressor
    spec:
      containers:
        - name: image-compressor
          image: manoharshetty507/image-compressor:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5013
          envFrom:
            - configMapRef:
                name: media-tools-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-tools-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5013
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5013
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: image-compressor
  namespace: media-tools
spec:
  selector:
    app: image-compressor
  ports:
    - name: http
      port: 5013
      targetPort: http
