apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-joiner
  namespace: media-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-joiner
  template:
    metadata:
      labels:
        app: audio-joiner
    spec:
      containers:
        - name: audio-joiner
          image: manoharshetty507/audio-joiner:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5002
          envFrom:
            - configMapRef:
                name: media-tools-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-tools-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: audio-joiner
  namespace: media-tools
spec:
  selector:
    app: audio-joiner
  ports:
    - name: http
      port: 5002
      targetPort: http
